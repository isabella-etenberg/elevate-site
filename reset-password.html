<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Reset password | Elevate</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="brand" href="./">Elevate</a></header>
<main>
<h1>Choose a new password</h1>
<div class="card">
  <p id="status">One moment while we check your link…</p>
  <form id="form" class="hidden" autocomplete="off">
    <label for="pw">New password</label>
    <input id="pw" type="password" minlength="6" autocomplete="new-password" required>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" minlength="6" autocomplete="new-password" required>
    <p class="small" style="margin-top:10px">At least 6 characters.</p>
    <button class="btn" id="go" type="submit">Update password</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js" integrity="sha384-dGnL7r9uccC9TdSdE05clTJ6esxMU42XBQ1/BWLzKQOBi7qR1aCMRIi0LzUmexIg" crossorigin="anonymous"></script>
<script>
const sb = supabase.createClient("https://ygvelwkhjdwpuwekhfwe.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndmVsd2toamR3cHV3ZWtoZndlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5Mjk1OTksImV4cCI6MjEwNjUwNTU5OX0.u8MqH28e9z3zuzR3wKnQReAFaDq8sKSKumywgQkWTH0", {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});
const q = new URLSearchParams(location.search);
const tokenHash = q.get("token_hash");
const type = q.get("type");
const status = document.getElementById("status"), form = document.getElementById("form"), msg = document.getElementById("msg");
function bad() {
  status.textContent = "This link has expired or was already used. Open the Elevate app and request a new password reset email.";
}
if (!tokenHash || type !== "recovery") {
  bad();
} else {
  sb.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" }).then(function (r) {
    history.replaceState(null, "", location.pathname);
    if (r.error) { bad(); return; }
    status.classList.add("hidden");
    form.classList.remove("hidden");
  }).catch(bad);
}
form.addEventListener("submit", function (e) {
  e.preventDefault();
  const a = document.getElementById("pw").value, c = document.getElementById("pw2").value;
  msg.className = "msg";
  if (a.length < 6) { msg.textContent = "Use at least 6 characters."; msg.classList.add("err"); return; }
  if (a !== c) { msg.textContent = "The two passwords don't match."; msg.classList.add("err"); return; }
  const go = document.getElementById("go");
  go.disabled = true;
  sb.auth.updateUser({ password: a }).then(function (r) {
    if (r.error) {
      go.disabled = false;
      msg.textContent = r.error.message || "Couldn't update your password. Try again.";
      msg.classList.add("err");
      return;
    }
    form.classList.add("hidden");
    status.classList.remove("hidden");
    status.textContent = "Your password is updated. Open the Elevate app and sign in with your new password.";
    sb.auth.signOut();
  }).catch(function () {
    go.disabled = false;
    msg.textContent = "Couldn't update your password. Check your connection and try again.";
    msg.classList.add("err");
  });
});
</script>
</main>
<footer>
  <a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a>
</footer>
</body>
</html>
